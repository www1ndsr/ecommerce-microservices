services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  auth-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: auth}
  user-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: users}
  product-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: products}
  order-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: orders}
  payment-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: payments}
  notification-db:
    image: mongo:7
  cart-db:
    image: redis:7
  inventory-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: inventory}
  review-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: reviews}
  promotion-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: promotions}
  shipping-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: shipping}
  wishlist-db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: wishlist}

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://app:app@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
    depends_on: [auth-db]

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql://app:app@product-db:5432/products
    depends_on: [product-db]

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://app:app@user-db:5432/users
    depends_on: [user-db]

  cart-service:
    build: ./services/cart-service
    environment:
      REDIS_URL: redis://cart-db:6379/0
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
    depends_on: [cart-db, product-service, inventory-service]

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql://app:app@order-db:5432/orders
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CART_SERVICE_URL: http://cart-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
    depends_on: [order-db, rabbitmq, cart-service, product-service, inventory-service]

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql://app:app@payment-db:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: [payment-db, rabbitmq]

  notification-service:
    build: ./services/notification-service
    environment:
      MONGODB_URL: mongodb://notification-db:27017
      MONGODB_DATABASE: notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: [notification-db, rabbitmq]

  inventory-service:
    build: ./services/inventory-service
    environment: {DATABASE_URL: postgresql://app:app@inventory-db:5432/inventory}
    depends_on: [inventory-db]
  review-service:
    build: ./services/review-service
    environment: {DATABASE_URL: postgresql://app:app@review-db:5432/reviews}
    depends_on: [review-db]
  promotion-service:
    build: ./services/promotion-service
    environment: {DATABASE_URL: postgresql://app:app@promotion-db:5432/promotions}
    depends_on: [promotion-db]
  shipping-service:
    build: ./services/shipping-service
    environment:
      DATABASE_URL: postgresql://app:app@shipping-db:5432/shipping
      ORDER_SERVICE_URL: http://order-service:8000
    depends_on: [shipping-db, order-service]
  wishlist-service:
    build: ./services/wishlist-service
    environment: {DATABASE_URL: postgresql://app:app@wishlist-db:5432/wishlist}
    depends_on: [wishlist-db]

  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      CART_SERVICE_URL: http://cart-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      REVIEW_SERVICE_URL: http://review-service:8000
      PROMOTION_SERVICE_URL: http://promotion-service:8000
      SHIPPING_SERVICE_URL: http://shipping-service:8000
      WISHLIST_SERVICE_URL: http://wishlist-service:8000
      UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-10}
      RATE_LIMIT_REQUESTS: ${GATEWAY_RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service
      - review-service
      - promotion-service
      - shipping-service
      - wishlist-service
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - gateway
